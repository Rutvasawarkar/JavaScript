<!DOCTYPE html>
<html>
<head>
    <title>Gym Admission Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        .container {
            width: 400px;
            margin: 50px auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
        }

        h2 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 10px;
        }

        input, select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        .error {
            color: red;
            font-size: 13px;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            background-color: black;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #333;
        }

        #success {
            color: green;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Gym Admission Form</h2>

    <form id="gymForm">

        <label>Name:</label>
        <input type="text" id="name" placeholder="Enter your name">
        <span id="nameError" class="error"></span>

        <label>Email:</label>
        <input type="email" id="email" placeholder="Enter your email">
        <span id="emailError" class="error"></span>

        <label>Phone:</label>
        <input type="text" id="phone" placeholder="Enter 10-digit phone number">
        <span id="phoneError" class="error"></span>

        <label>Age:</label>
        <input type="number" id="age" placeholder="Enter your age">
        <span id="ageError" class="error"></span>

        <label>Membership:</label>
        <select id="membership">
            <option value="">Select Membership</option>
            <option value="Monthly">Monthly</option>
            <option value="Quarterly">Quarterly</option>
            <option value="Yearly">Yearly</option>
        </select>
        <span id="membershipError" class="error"></span>

        <button type="submit">Submit</button>

        <p id="success"></p>
    </form>
</div>

<script>
    // Access form fields using DOM
    let name = document.getElementById("name");
    let email = document.getElementById("email");
    let phone = document.getElementById("phone");
    let age = document.getElementById("age");
    let membership = document.getElementById("membership");

    // Live validation for name
    name.addEventListener("input", function() {
        if (name.value.trim() === "") {
            document.getElementById("nameError").textContent =
                "Name is required";
        } else {
            document.getElementById("nameError").textContent = "";
        }
    });

    // Live validation for email
    email.addEventListener("input", function() {
        let pattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;

        if (!pattern.test(email.value)) {
            document.getElementById("emailError").textContent =
                "Enter a valid email";
        } else {
            document.getElementById("emailError").textContent = "";
        }
    });

    // Live validation for phone
    phone.addEventListener("input", function() {
        let pattern = /^[0-9]{10}$/;

        if (!pattern.test(phone.value)) {
            document.getElementById("phoneError").textContent =
                "Phone must contain 10 digits";
        } else {
            document.getElementById("phoneError").textContent = "";
        }
    });

    // Live validation for age
    age.addEventListener("input", function() {
        if (age.value < 18 || age.value > 60) {
            document.getElementById("ageError").textContent =
                "Age must be between 18 and 60";
        } else {
            document.getElementById("ageError").textContent = "";
        }
    });

    // Live validation for membership
    membership.addEventListener("change", function() {
        if (membership.value === "") {
            document.getElementById("membershipError").textContent =
                "Please select a membership";
        } else {
            document.getElementById("membershipError").textContent = "";
        }
    });

    // Form submit event
    document.getElementById("gymForm").addEventListener("submit", function(event) {

        event.preventDefault();

        // Check whether all fields are valid
        if (
            name.value.trim() !== "" &&
            /^[^ ]+@[^ ]+\.[a-z]{2,3}$/.test(email.value) &&
            /^[0-9]{10}$/.test(phone.value) &&
            age.value >= 18 &&
            age.value <= 60 &&
            membership.value !== ""
        ) {
            document.getElementById("success").textContent =
                "Gym admission submitted successfully!";
        } else {
            document.getElementById("success").textContent =
                "Please correct the errors.";
        }
    });
</script>

</body>
</html>
