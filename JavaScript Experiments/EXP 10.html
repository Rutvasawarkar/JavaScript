        function loadStudents() {

            // Convert JSON data into JavaScript object
            const students = JSON.parse(jsonData);

            const table = document.getElementById("studentTable");

            students.forEach(function(student) {

                // Create a new row
                let row = table.insertRow();

                // Add data to each cell
                row.insertCell(0).innerHTML = student.name;
                row.insertCell(1).innerHTML = student.prn;
                row.insertCell(2).innerHTML = student.branch;
                row.insertCell(3).innerHTML = student.semester;
                row.insertCell(4).innerHTML = student.cgpa;

            });
        }
